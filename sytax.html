<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sytax</title>
  </head>
  <style></style>
  <body>
    <!-- អក្សរដិត -->
    <b>This is bold tag</b><br />
    <span>This is strong tag</span><br />
    <!-- Letter dot -->
    <hr />

    <!-- អក្សរទ្រេត -->
    <i class="i"><u>This is italic tag</u></i
    ><br />
    <br />
    <!-- គូសបន្ទាត់ពីក្រោម -->
    <hr />
    <em><u>This is em tag</u></em
    ><br />
    <ins>This is ins tag</ins> <br />
    <br />
    <hr />

    <!-- គូសបន្ទាត់លើអក្សរ -->
    <strike>This is strike tag</strike> <br />
    <del>This is del tag</del>
    <s>This is s tag</s>
    <hr>
    <!-- អក្សរធំ និង អក្សរតូច -->
    <big>This is big tag</big> <br>
    <small>This is small tag</small> <br>
    <hr>
    (a+b)<sup>2</sup>=a <sup>2</sup>+2ab+ b<sup>2</sup><br>
    log <sup>10</sup> <br>
    CO <sup>2</sup> <br>
    H <sub>2</sub> <sup>0</sup> <br>
    

  </body>
